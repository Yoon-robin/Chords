<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 저장된 테마를 그리기 전에 적용 (useTheme과 같은 키, 기본은 다크)
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('heroui-theme') || 'dark';
        } catch (e) {}
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16120f" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="코드북" />
    <meta name="description" content="어쿠스틱 기타 튜너, 코드 사전, 송북, 연습 도구" />
    <title>코드북</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
